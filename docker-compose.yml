version: "3.9"

services:
  barber_web_1:
    build: .
    container_name: barber_web_1_container
    entrypoint: /entrypoints.sh
    command: web
    ports:
      - "8001:8000"  # host:container
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "migrate", "--check"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: barber_network
