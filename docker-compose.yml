version: "3.9"

services:
  barber_web:
    build: .
    container_name: barber_web_container
    entrypoint: /entrypoints.sh
    command: web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--deploy"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: barber_network
