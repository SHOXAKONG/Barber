version: "3.9"

services:
  web:
    container_name: web_service
    build: .
    entrypoint: /entrypoints.sh
    command: web
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "migrate", "--check"]
      interval: 10s
      timeout: 5s
      retries: 5
